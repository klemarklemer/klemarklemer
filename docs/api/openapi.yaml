  /v1/claim/{id}/intake:
    post:
      tags:
      - Claims
      summary: Trigger intake evaluation
      description: Runs the Intake Agent evaluation to verify document completeness and classify severity.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Intake evaluated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetailResponse'
  /v1/claim/{id}/assignment:
    post:
      tags:
      - Claims
      summary: Trigger officer assignment
      description: Executes deterministic scoring to bind the optimal claims officer based on current
        workload and skill rating.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Officer assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetailResponse'
  /v1/claim/{id}/assessment:
    post:
      tags:
      - Claims
      summary: Trigger assessment recommendation
      description: Synthesizes policy coverage limits against loss evidence to produce an explainable
        recommendation.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Assessment recommendation generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetailResponse'
  /v1/claim/{id}/approval:
    post:
      tags:
      - Claims
      summary: Submit human approval (Binding Decision)
      description: Records human claims officer approval or rejection. Approving creates a binding Decision
        and closes the claim.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanApprovalRequest'
      responses:
        '200':
          description: Human approval decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetailResponse'
  /v1/demo/reset:
    post:
      tags:
      - Demo
      summary: Reset demo environment
      description: Restores CLM-2026-0042 and claims officer workloads to initial demo state.
      responses:
        '200':
          description: Demo state reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetailResponse'
components:
  schemas:
    CreateClaimRequest:
      type: object
      required:
      - policy_id
      - claim_type
      - incident_description
      - estimated_loss
      properties:
        policy_id:
          type: integer
          example: 1
        claim_type:
          type: string
          example: MOTOR
        incident_description:
          type: string
          example: Collision with road barrier during heavy rain on highway KM 42.
        estimated_loss:
          type: number
          format: double
          example: 4200
    UploadDocumentRequest:
      type: object
      properties:
        document_type:
          type: string
          example: POLICE_REPORT
        file_name:
          type: string
          example: police_report_km42.pdf
        file_url:
          type: string
          example: https://storage.googleapis.com/klemarklemer-claims-docs/claims/CLM-2026-0042/police_report_km42.pdf
    HumanApprovalRequest:
      type: object
      required:
      - action
      properties:
        officer_id:
          type: integer
          example: 1
        action:
          type: string
          enum:
          - APPROVE
          - REJECT
          example: APPROVE
        notes:
          type: string
          example: Verified police report and damage photos match collision claim.
    ClaimDetailResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          $ref: '#/components/schemas/Claim'
    ClaimListResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalRecords:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 1
    Claim:
      type: object
      properties:
        id:
          type: integer
          example: 1
        claim_number:
          type: string
          example: CLM-2026-0042
        policy_id:
          type: integer
          example: 1
        stage:
          type: string
          enum:
          - INTAKE
          - DOCUMENT_VERIFICATION
          - ASSIGNMENT
          - ASSESSMENT
          - DECISION
          - CLOSED
          example: DOCUMENT_VERIFICATION
        document_completeness:
          type: string
          enum:
          - COMPLETE
          - INCOMPLETE
          example: INCOMPLETE
        survey_required:
          type: boolean
          example: false
        claim_type:
          type: string
          example: MOTOR
        severity:
          type: string
          example: MEDIUM
        incident_description:
          type: string
          example: Front bumper collision with road barrier during heavy rain on highway KM 42.
        estimated_loss:
          type: number
          example: 4200
        approved_amount:
          type: number
          example: 0
        current_officer_id:
          type: integer
          nullable: true
          example: 1
        status:
          type: string
          example: OPEN
        claim_sla_due_at:
          type: string
          format: date-time
        stage_sla_due_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ClaimDocument'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ClaimEvent'
        assignment:
          $ref: '#/components/schemas/Assignment'
        recommendation:
          $ref: '#/components/schemas/AssessmentRecommendation'
        policy:
          $ref: '#/components/schemas/Policy'
          description: Preloaded on claim detail. Present whenever policy_id resolves.
        current_officer:
          $ref: '#/components/schemas/ClaimsOfficer'
          description: Preloaded once Loop 2 has assigned the claim; null before that.
    ClaimDocument:
      type: object
      properties:
        id:
          type: integer
        claim_id:
          type: integer
        document_type:
          type: string
        file_name:
          type: string
        file_url:
          type: string
        status:
          type: string
        extracted_data:
          type: string
    ClaimEvent:
      type: object
      properties:
        id:
          type: integer
        claim_id:
          type: integer
        actor_name:
          type: string
        actor_type:
          type: string
        action:
          type: string
        previous_stage:
          type: string
        new_stage:
          type: string
        payload:
          type: string
          description: JSON string. For RECOMMENDATION_GENERATED it carries outcome, confidence, reasons
            and engine, where engine names the reasoning backend that answered (e.g. "gemini-3.5-flash
            via vertex-ai", or "deterministic-rules" when no model credential is configured).
          example: '{"confidence":0.95,"engine":"gemini-3.5-flash via vertex-ai","outcome":"APPROVE","reasons":"Policy
            POL-MOTOR-2026-8819 is ACTIVE..."}'
        created_at:
          type: string
          format: date-time
    Assignment:
      type: object
      properties:
        id:
          type: integer
        claim_id:
          type: integer
        officer_id:
          type: integer
        workload_score:
          type: number
        skill_score:
          type: number
        total_score:
          type: number
        assigned_at:
          type: string
          format: date-time
    AssessmentRecommendation:
      type: object
      properties:
        id:
          type: integer
        claim_id:
          type: integer
        outcome:
          type: string
          enum:
          - APPROVE
          - REJECT
          - MANUAL_REVIEW
        confidence:
          type: number
          description: 0.0-1.0.
        reasons:
          type: string
          description: Justification citing the policy and loss figures the recommendation was grounded
            in.
        generated_at:
          type: string
          format: date-time
      description: Advisory only. A claims officer still binds the decision through POST /v1/claim/{id}/approval;
        an APPROVE here settles nothing.
    Policy:
      type: object
      description: The cover a claim is assessed against. Loop 3 reads max_coverage_amount, deductible_amount,
        status and expiry_date to reach its recommendation.
      properties:
        id:
          type: integer
          example: 1
        policy_number:
          type: string
          example: POL-MOTOR-2026-8819
        policy_holder_name:
          type: string
          example: Budi Hartono
        vehicle_plate:
          type: string
          example: B 1234 XYZ
        vehicle_model:
          type: string
          example: Toyota Avanza 2023
        coverage_type:
          type: string
          example: COMPREHENSIVE
        max_coverage_amount:
          type: number
          format: double
          example: 45000.0
        deductible_amount:
          type: number
          format: double
          example: 500.0
        effective_date:
          type: string
          format: date-time
        expiry_date:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - LAPSED
          - EXPIRED
          example: ACTIVE
    ClaimsOfficer:
      type: object
      description: A claims officer. Loop 2 scores every officer on workload and skill, then assigns the
        highest scorer.
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Alex Rivera
        email:
          type: string
          example: alex.rivera@klemarklemer.test
        is_available:
          type: boolean
          example: true
        current_workload:
          type: integer
          description: Open claims held. Incremented on assignment, decremented on closure.
          example: 4
        motor_skill_rating:
          type: number
          format: double
          description: 0-5.
          example: 4.8
