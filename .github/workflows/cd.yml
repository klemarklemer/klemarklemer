name: CD

on:
  push:
    tags:
      - 'production-api-core-v*'
      - 'staging-api-core-v*'
      - 'development-api-core-v*'
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy Backend API to Cloud Run
    if: startsWith(github.ref, 'refs/tags/production-api-core-') || startsWith(github.ref, 'refs/tags/staging-api-core-') || startsWith(github.ref, 'refs/tags/development-api-core-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Environment & Version
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ $TAG =~ ^production- ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
          elif [[ $TAG =~ ^staging- ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud via WIF
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Push API Image
        if: ${{ secrets.WIF_PROVIDER != '' }}
        run: |
          gcloud auth configure-docker --quiet
          IMAGE_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/klemarklemer-api:${{ steps.meta.outputs.tag }}"
          docker build --build-arg SERVICE_NAME=core -t $IMAGE_TAG -f apps/api/Dockerfile apps/api
          docker push $IMAGE_TAG

      - name: Deploy to Cloud Run
        if: ${{ secrets.WIF_PROVIDER != '' }}
        run: |
          IMAGE_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/klemarklemer-api:${{ steps.meta.outputs.tag }}"
          gcloud run deploy klemarklemer-api-${{ steps.meta.outputs.env }} \
            --image $IMAGE_TAG \
            --platform managed \
            --region ${{ secrets.GCP_REGION || 'asia-southeast1' }} \
            --allow-unauthenticated \
            --set-env-vars="CORS_ALLOW_ORIGINS=https://klemarklemer.github.io"