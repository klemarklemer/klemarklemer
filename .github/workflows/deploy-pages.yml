name: Deploy Web to GitHub Pages

on:
  push:
    tags:
      - 'production-web-v*'
      - 'staging-web-v*'
      - 'development-web-v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Determine API base URL
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ $TAG =~ ^production-web-v ]]; then
            echo "api_url=https://klemarklemer-api-production-175694983194.asia-southeast1.run.app" >> $GITHUB_OUTPUT
          elif [[ $TAG =~ ^staging-web-v ]]; then
            echo "api_url=https://klemarklemer-api-staging-175694983194.asia-southeast1.run.app" >> $GITHUB_OUTPUT
          else
            echo "api_url=https://klemarklemer-api-development-175694983194.asia-southeast1.run.app" >> $GITHUB_OUTPUT
          fi
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ steps.meta.outputs.api_url }}
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/web/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
