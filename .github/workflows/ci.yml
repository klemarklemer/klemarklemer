name: CI & DevSecOps

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
              - 'Makefile'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
              - 'Makefile'

  security:
    name: DevSecOps & Security SAST
    needs: [changes]
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: apps/api/go.sum

      - name: Install govulncheck (Go Vulnerability Scanner)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (SAST)
        working-directory: apps/api
        run: govulncheck ./services/core/...

      - name: Install gosec (Go Security Checker)
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec (AST Rule Analysis)
        working-directory: apps/api
        run: gosec -exclude=G104 ./services/core/...

  api:
    name: Backend API (Go)
    needs: [changes, security]
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: apps/api/go.sum

      - name: Verify Go build
        working-directory: apps/api
        run: |
          go build ./services/core/...

      - name: Run Backend Tests
        working-directory: apps/api
        run: |
          go test ./services/core/... -v

  web:
    name: Frontend Web (React / Vite)
    needs: [changes]
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build Web Console
        working-directory: apps/web
        run: npm run build

      - name: Run Frontend Tests
        working-directory: apps/web
        run: npm run test
